services:
  rgsa-transformer:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: rgsa-transformer:5.6.2-gpu
    container_name: rgsa-transformer-gpu
    restart: unless-stopped
    
    # GPU access
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    
    environment:
      - PYTHONUNBUFFERED=1
      - TF_CPP_MIN_LOG_LEVEL=2
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    
    networks:
      - rgsa-network

networks:
  rgsa-network:
    driver: bridge